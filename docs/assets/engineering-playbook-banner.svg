<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Harshil Shah AI-First Engineering Playbook</title>
  <desc id="desc">Portfolio banner for a senior .NET and Azure engineering playbook focused on architecture, AI-assisted delivery, production readiness, and software craftsmanship.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="48%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>
  <path d="M0 276 C180 222 265 330 448 270 S760 224 960 282 S1135 318 1200 278 L1200 360 L0 360 Z" fill="#0f172a" opacity="0.32"/>

  <g opacity="0.16" stroke="#ffffff" stroke-width="1">
    <path d="M742 48h272M742 82h350M742 116h220M810 150h262M780 184h330"/>
    <circle cx="718" cy="48" r="5" fill="#ffffff"/>
    <circle cx="718" cy="82" r="5" fill="#ffffff"/>
    <circle cx="718" cy="116" r="5" fill="#ffffff"/>
    <circle cx="786" cy="150" r="5" fill="#ffffff"/>
    <circle cx="756" cy="184" r="5" fill="#ffffff"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="62" width="1056" height="236" rx="24" fill="#ffffff" opacity="0.1"/>
    <rect x="72" y="62" width="1056" height="236" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.2"/>
  </g>

  <text x="112" y="122" fill="#c7d2fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">SENIOR .NET / AZURE ENGINEERING</text>
  <text x="112" y="178" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="800">AI-First Engineering Playbook</text>
  <text x="112" y="226" fill="#e0f2fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="500">Architecture • Production Readiness • Technical Leadership • Software Craftsmanship</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
    <rect x="112" y="252" width="148" height="38" rx="19" fill="#f97316"/>
    <text x="136" y="277" fill="#fff7ed">Cloud Native</text>
    <rect x="276" y="252" width="170" height="38" rx="19" fill="#14b8a6"/>
    <text x="300" y="277" fill="#ecfeff">AI-Assisted SDLC</text>
    <rect x="462" y="252" width="160" height="38" rx="19" fill="#6366f1"/>
    <text x="486" y="277" fill="#eef2ff">Delivery Quality</text>
  </g>
</svg>
